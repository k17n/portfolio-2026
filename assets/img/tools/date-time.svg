<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <defs>
    <mask id="dt-cal">
      <rect width="72" height="72" fill="#fff"/>
      <!-- header rule and date dots -->
      <rect x="6" y="25" width="50" height="3.5" fill="#000"/>
      <rect x="14" y="34" width="6" height="6" rx="2" fill="#000"/>
      <rect x="25" y="34" width="6" height="6" rx="2" fill="#000"/>
      <rect x="14" y="45" width="6" height="6" rx="2" fill="#000"/>
      <!-- gap around the clock badge -->
      <circle cx="51" cy="51" r="20.5" fill="#000"/>
    </mask>
    <mask id="dt-clock">
      <rect width="72" height="72" fill="#fff"/>
      <path d="M51 42v9.5l6.5 4" fill="none" stroke="#000" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g mask="url(#dt-cal)" fill="#000">
    <rect x="6" y="12" width="50" height="48" rx="11"/>
    <rect x="16" y="5" width="6.5" height="14" rx="3.25"/>
    <rect x="39.5" y="5" width="6.5" height="14" rx="3.25"/>
  </g>
  <circle cx="51" cy="51" r="16.5" fill="#000" mask="url(#dt-clock)"/>
</svg>
